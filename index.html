<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Poker Chip Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:   #1a5c2a;
      --green2:  #246b35;
      --felt:    #0f3d1c;
      --gold:    #d4a017;
      --gold2:   #f0c040;
      --red:     #c0392b;
      --blue:    #1a6fa8;
      --chip:    #e8e0d0;
      --bg:      #0a2010;
      --card-bg: #162e1e;
      --text:    #e8e0d0;
      --muted:   #8aaa8a;
      --border:  #2a6040;
      --radius:  12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ── SETUP SCREEN ─────────────────────────────────────── */
    #setup-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      min-height: 100dvh;
    }

    .logo {
      font-size: 2.4rem;
      margin-bottom: 4px;
      filter: drop-shadow(0 2px 8px rgba(212,160,23,.4));
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gold2);
      letter-spacing: .04em;
      text-align: center;
      margin-bottom: 6px;
    }

    .tagline {
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: 32px;
      text-align: center;
    }

    .setup-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 16px;
    }

    .setup-card h2 {
      font-size: .95rem;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 14px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    input[type="text"], input[type="number"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      padding: 10px 14px;
      flex: 1;
      outline: none;
      transition: border-color .2s;
      -webkit-appearance: none;
    }
    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--gold);
    }
    input[type="number"] { width: 110px; flex: none; }

    .btn {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: .95rem;
      font-weight: 600;
      padding: 10px 18px;
      transition: filter .15s, transform .1s;
      letter-spacing: .02em;
    }
    .btn:active { transform: scale(.97); }
    .btn-gold  { background: var(--gold); color: #111; }
    .btn-gold:hover  { filter: brightness(1.12); }
    .btn-green { background: var(--green2); color: var(--text); }
    .btn-green:hover { filter: brightness(1.15); }
    .btn-red   { background: var(--red); color: #fff; }
    .btn-red:hover   { filter: brightness(1.15); }
    .btn-blue  { background: var(--blue); color: #fff; }
    .btn-blue:hover  { filter: brightness(1.15); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .btn-ghost:hover { border-color: var(--gold); color: var(--gold); }
    .btn-teal  { background: #0e7c6a; color: #fff; }
    .btn-teal:hover  { filter: brightness(1.15); }
    .btn-dark  { background: #2a2a2a; color: #888; border: 1px solid #444; }
    .btn-dark:hover  { border-color: var(--red); color: var(--red); }
    .btn-block { width: 100%; display: block; padding: 13px; font-size: 1.05rem; }

    .player-tag {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 7px;
      font-size: .95rem;
    }
    .player-tag .remove { background: none; border: none; color: var(--red); cursor: pointer; font-size: 1.1rem; padding: 0 4px; }

    .buyin-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .buyin-row label { color: var(--muted); font-size: .9rem; }
    .buyin-row input { width: 120px; }

    /* ── GAME SCREEN ──────────────────────────────────────── */
    #game-screen { display: none; flex-direction: column; min-height: 100dvh; }

    /* Top Bar */
    .topbar {
      background: var(--felt);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-title { font-size: 1rem; font-weight: 700; color: var(--gold2); }
    .topbar-meta  { font-size: .8rem; color: var(--muted); }
    .topbar-right { display: flex; gap: 8px; align-items: center; }

    /* Pot Area */
    .pot-area {
      background: linear-gradient(135deg, var(--green) 0%, var(--felt) 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 16px 14px;
      text-align: center;
    }
    .pot-label { font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 4px; }
    .pot-amount {
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--gold2);
      line-height: 1;
      letter-spacing: -.02em;
      text-shadow: 0 2px 12px rgba(212,160,23,.5);
      margin-bottom: 10px;
    }
    .pot-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

    /* Current Bet Banner */
    .bet-banner {
      background: var(--blue);
      padding: 6px 16px;
      font-size: .85rem;
      text-align: center;
      display: none;
    }
    .bet-banner.active { display: block; }

    /* Players Grid */
    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
      padding: 12px;
      flex: 1;
    }

    .player-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color .2s;
      position: relative;
      overflow: hidden;
    }
    .player-card.active-turn { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
    .player-card.folded { opacity: .5; }
    .player-card.allin  { border-color: var(--red); }
    .player-card.winner { border-color: #4caf50; box-shadow: 0 0 12px rgba(76,175,80,.4); }
    .player-card.eliminated { opacity: .35; border-style: dashed; }

    .player-status-badge {
      position: absolute;
      top: 7px;
      right: 7px;
      font-size: .65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 2px 6px;
      border-radius: 999px;
    }
    .badge-fold   { background: #555; color: #ccc; }
    .badge-allin  { background: var(--red); color: #fff; }
    .badge-active { background: var(--gold); color: #111; }
    .badge-out    { background: #333; color: #888; }
    .badge-dealer { background: var(--green2); color: var(--gold2); }

    .player-name {
      font-size: .95rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 48px;
    }
    .player-chips {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--gold2);
      line-height: 1;
      letter-spacing: -.02em;
    }
    .player-chips.low  { color: var(--red); }
    .player-chips.zero { color: #666; }

    .player-bet-row {
      font-size: .75rem;
      color: var(--muted);
      min-height: 14px;
    }

    .player-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-top: 2px;
    }
    .player-actions .btn {
      font-size: .78rem;
      padding: 7px 4px;
      border-radius: 6px;
    }
    .player-actions .btn-wide {
      grid-column: span 2;
    }

    /* Bottom Bar */
    .bottombar {
      background: var(--felt);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ── LOG PANEL ────────────────────────────────────────── */
    #log-panel {
      position: fixed;
      right: 0; top: 0; bottom: 0;
      width: min(340px, 100vw);
      background: #0d1f12;
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform .25s ease;
      z-index: 200;
      display: flex;
      flex-direction: column;
    }
    #log-panel.open { transform: translateX(0); }
    .log-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--felt);
    }
    .log-header h3 { font-size: 1rem; color: var(--gold); }
    .log-list {
      overflow-y: auto;
      flex: 1;
      padding: 10px;
    }
    .log-entry {
      font-size: .8rem;
      padding: 6px 8px;
      border-radius: 6px;
      margin-bottom: 5px;
      border-left: 3px solid var(--border);
      background: var(--card-bg);
      color: var(--muted);
    }
    .log-entry .log-time { font-size: .7rem; opacity: .6; }
    .log-entry.win  { border-left-color: #4caf50; color: var(--text); }
    .log-entry.bet  { border-left-color: var(--blue); }
    .log-entry.fold { border-left-color: #555; }
    .log-entry.new-hand { border-left-color: var(--gold); color: var(--gold); font-weight: 600; }

    /* ── MODAL ────────────────────────────────────────────── */
    #modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #modal-overlay.open { display: flex; }
    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 380px;
      max-height: 90dvh;
      overflow-y: auto;
    }
    .modal h3 { font-size: 1.1rem; color: var(--gold2); margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .modal-actions .btn { flex: 1; min-width: 100px; }
    .chip-quick { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    .chip-quick button {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--gold);
      cursor: pointer;
      font-size: .85rem;
      padding: 6px 12px;
      transition: all .15s;
    }
    .chip-quick button:hover { border-color: var(--gold); background: var(--felt); }
    .player-select-list { margin: 10px 0; }
    .player-select-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      margin-bottom: 7px;
      cursor: pointer;
      transition: border-color .15s;
    }
    .player-select-item:hover { border-color: var(--gold); }
    .player-select-item.selected { border-color: #4caf50; background: #0a2510; }
    .player-select-item input[type="checkbox"] { accent-color: #4caf50; width: 18px; height: 18px; pointer-events: none; }
    .player-select-info { flex: 1; }
    .player-select-name { font-size: .95rem; font-weight: 600; }
    .player-select-chips { font-size: .8rem; color: var(--muted); }
    .split-pct { font-size: .75rem; color: var(--gold); margin-left: auto; }
    .modal-note { font-size: .8rem; color: var(--muted); margin-top: 8px; line-height: 1.5; }

    /* ── RESPONSIVE ───────────────────────────────────────── */
    @media (min-width: 600px) {
      .players-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; padding: 16px; }
    }
    @media (max-width: 400px) {
      .players-grid { grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
      .player-chips { font-size: 1.35rem; }
    }

    /* ── UTILITIES ────────────────────────────────────────── */
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .mt8 { margin-top: 8px; }
    .mt12 { margin-top: 12px; }
    .overlay-bg { position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:190;display:none; }
    .overlay-bg.open { display:block; }

    /* Dealer / blind chip indicators */
    .dealer-btn, .blind-btn {
      display: inline-block;
      font-size: .6rem;
      font-weight: 800;
      border-radius: 50%;
      width: 20px; height: 20px;
      line-height: 20px;
      text-align: center;
      margin-right: 2px;
      flex-shrink: 0;
      vertical-align: middle;
    }
    .dealer-btn { background: var(--chip); color: #1a1a1a; }
    .sb-btn  { background: #1a6fa8; color: #fff; }
    .bb-btn  { background: #7b2d8b; color: #fff; }

    .blinds-info-bar {
      background: #0d2a1a;
      border-bottom: 1px solid var(--border);
      padding: 5px 16px;
      font-size: .8rem;
      color: var(--muted);
      text-align: center;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .blinds-info-bar span { color: var(--text); font-weight: 600; }

    .standings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
    }
    .standings-rank { font-size: .85rem; color: var(--muted); width: 24px; }
    .standings-name { flex: 1; font-size: .95rem; }
    .standings-chips { font-size: 1rem; font-weight: 700; color: var(--gold2); }
    .standings-delta { font-size: .8rem; margin-left: 8px; }
    .delta-pos { color: #4caf50; }
    .delta-neg { color: var(--red); }

    /* Chip strip */
    .chip-strip {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 14px 0 8px;
    }
    .chip-token {
      width: 54px; height: 54px;
      border-radius: 50%;
      border: 3px dashed rgba(255,255,255,.28);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: .68rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform .1s, filter .15s;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
      user-select: none;
      letter-spacing: -.02em;
    }
    .chip-token:hover  { filter: brightness(1.25); transform: scale(1.08) translateY(-2px); }
    .chip-token:active { transform: scale(.92); }
    .chip-c1   { background: radial-gradient(circle at 35% 35%, #d8d8d8, #909090); color: #222; text-shadow: none; }
    .chip-c5   { background: radial-gradient(circle at 35% 35%, #e85050, #a01010); }
    .chip-c10  { background: radial-gradient(circle at 35% 35%, #4080e0, #1840b0); }
    .chip-c25  { background: radial-gradient(circle at 35% 35%, #40b840, #186818); }
    .chip-c50  { background: radial-gradient(circle at 35% 35%, #e08030, #904020); }
    .chip-c100 { background: radial-gradient(circle at 35% 35%, #383838, #101010); }
    .chip-c500 { background: radial-gradient(circle at 35% 35%, #9050d0, #501890); }
    .chip-c1k  { background: radial-gradient(circle at 35% 35%, #c8a810, #806408); }
    .chip-c5k  { background: radial-gradient(circle at 35% 35%, #50c8c8, #187878); }

    .bet-total-display {
      text-align: center;
      font-size: 2rem;
      font-weight: 800;
      color: var(--gold2);
      letter-spacing: -.02em;
      margin: 6px 0 2px;
    }
    .bet-total-label {
      text-align: center;
      font-size: .75rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* Chop modal */
    .mode-toggle {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .mode-toggle button {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: .85rem;
      font-weight: 600;
      padding: 9px;
      transition: background .15s, color .15s;
    }
    .mode-toggle button.active { background: var(--green2); color: var(--text); }

    .chop-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      margin-top: 10px;
      font-size: .9rem;
    }
    .chop-total-row .ok  { color: #4caf50; font-weight: 700; }
    .chop-total-row .bad { color: var(--red); font-weight: 700; }

    .chop-custom-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      margin-bottom: 7px;
    }
    .chop-custom-row .player-name-label { flex: 1; font-size: .95rem; font-weight: 600; }
    .chop-custom-row input {
      width: 110px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: .95rem;
      padding: 7px 10px;
      text-align: right;
    }
    .chop-custom-row input:focus { border-color: var(--gold); outline: none; }

    /* ── ANIMATIONS ───────────────────────────────────────── */
    .anim-overlay {
      position: fixed; inset: 0;
      z-index: 999;
      pointer-events: none;
      overflow: hidden;
    }

    /* Coin rain */
    @keyframes coinFall {
      0%   { transform: translateY(-80px) rotate(0deg);   opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translateY(110vh) rotate(600deg); opacity: 0; }
    }
    .anim-coin {
      position: absolute;
      top: 0;
      animation: coinFall linear forwards;
    }

    /* Winner banner */
    @keyframes winBannerPop {
      0%   { transform: translate(-50%,-50%) scale(0) rotate(-12deg); opacity: 0; }
      22%  { transform: translate(-50%,-50%) scale(1.18) rotate(4deg); opacity: 1; }
      38%  { transform: translate(-50%,-50%) scale(0.97) rotate(-1deg); }
      55%  { transform: translate(-50%,-50%) scale(1) rotate(0deg); }
      78%  { opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(0.85) rotate(3deg); opacity: 0; }
    }
    .anim-win-banner {
      position: absolute;
      top: 44%; left: 50%;
      transform: translate(-50%,-50%);
      background: linear-gradient(135deg, #c8920e 0%, #f0c040 50%, #c8920e 100%);
      color: #111;
      padding: 24px 48px;
      border-radius: 20px;
      text-align: center;
      white-space: nowrap;
      animation: winBannerPop 2.8s cubic-bezier(.34,1.56,.64,1) forwards;
      box-shadow: 0 10px 60px rgba(212,160,23,.8), 0 0 0 4px rgba(255,255,255,.25);
    }

    /* Bust — chips fly outward */
    @keyframes bustChipFly {
      0%   { transform: translate(-50%,-50%) translate(0,0) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%,-50%) translate(var(--tx),var(--ty)) scale(0); opacity: 0; }
    }
    .anim-bust-chip {
      position: absolute;
      top: 44%; left: 50%;
      animation: bustChipFly ease-out forwards;
    }

    /* Bust banner */
    @keyframes screenShake {
      0%,100% { transform: translateX(0); }
      10%      { transform: translateX(-10px) rotate(-.5deg); }
      20%      { transform: translateX(10px)  rotate(.5deg); }
      30%      { transform: translateX(-8px); }
      40%      { transform: translateX(8px); }
      50%      { transform: translateX(-5px); }
      60%      { transform: translateX(5px); }
      70%      { transform: translateX(-3px); }
      80%      { transform: translateX(3px); }
    }
    .screen-shake { animation: screenShake .6s ease-in-out; }

    @keyframes bustBannerIn {
      0%   { transform: translate(-50%,-50%) translateY(90px) scale(0.5); opacity: 0; }
      18%  { transform: translate(-50%,-50%) translateY(-12px) scale(1.08); opacity: 1; }
      32%  { transform: translate(-50%,-50%) scale(0.98); }
      45%  { transform: translate(-50%,-50%) scale(1) rotate(-1deg); }
      60%  { transform: translate(-50%,-50%) scale(1) rotate(1deg); }
      75%  { opacity: 1; }
      100% { transform: translate(-50%,-50%) translateY(-40px) scale(0.8); opacity: 0; }
    }
    .anim-bust-banner {
      position: absolute;
      top: 44%; left: 50%;
      transform: translate(-50%,-50%);
      background: linear-gradient(135deg, #8b1010 0%, #c0392b 60%, #8b1010 100%);
      color: #fff;
      padding: 24px 48px;
      border-radius: 20px;
      text-align: center;
      white-space: nowrap;
      animation: bustBannerIn 2.8s cubic-bezier(.34,1.56,.64,1) forwards;
      box-shadow: 0 10px 60px rgba(192,57,43,.8), 0 0 0 4px rgba(255,255,255,.15);
    }
  </style>
</head>
<body>

     SETUP SCREEN
═══════════════════════════════════════════════════════ -->
<div id="setup-screen">
  <div class="logo">♠️</div>
  <h1>Poker Chip Tracker</h1>
  <p class="tagline">No physical chips? No problem. Track everything here.</p>

  <div class="setup-card">
    <h2>Add Players</h2>
    <div class="input-row">
      <input type="text" id="player-name-input" placeholder="Player name" maxlength="20" autocomplete="off" />
      <button class="btn btn-gold" onclick="addPlayer()">Add</button>
    </div>
    <div id="player-list"></div>
    <p id="player-hint" style="font-size:.8rem;color:var(--muted);margin-top:6px;">Add 2–10 players to begin.</p>
  </div>

  <div class="setup-card">
    <h2>Buy-In Settings</h2>
    <div class="buyin-row">
      <label>Starting chips per player:</label>
      <input type="number" id="buyin-amount" value="1000" min="10" max="1000000" step="10" />
    </div>
    <div class="chip-quick mt8">
      <button onclick="setBuyin(500)">500</button>
      <button onclick="setBuyin(1000)">1,000</button>
      <button onclick="setBuyin(1500)">1,500</button>
      <button onclick="setBuyin(5000)">5,000</button>
      <button onclick="setBuyin(10000)">10,000</button>
    </div>
  </div>

  <div class="setup-card">
    <h2>Blind Settings</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
      <div>
        <label style="font-size:.8rem;color:var(--muted);display:block;margin-bottom:5px;">
          <span class="blind-btn sb-btn">SB</span> Small Blind
        </label>
        <input type="number" id="small-blind" value="25" min="1" style="width:100%;" oninput="syncBB()" />
      </div>
      <div>
        <label style="font-size:.8rem;color:var(--muted);display:block;margin-bottom:5px;">
          <span class="blind-btn bb-btn">BB</span> Big Blind
        </label>
        <input type="number" id="big-blind" value="50" min="1" style="width:100%;" />
      </div>
    </div>
    <div class="chip-quick">
      <button onclick="setBlinds(5,10)">5/10</button>
      <button onclick="setBlinds(10,20)">10/20</button>
      <button onclick="setBlinds(25,50)">25/50</button>
      <button onclick="setBlinds(50,100)">50/100</button>
      <button onclick="setBlinds(100,200)">100/200</button>
    </div>
    <div style="margin-top:12px;display:flex;align-items:center;gap:8px;">
      <input type="checkbox" id="auto-post-blinds" checked style="width:17px;height:17px;accent-color:var(--gold);flex-shrink:0;" />
      <label for="auto-post-blinds" style="font-size:.85rem;color:var(--muted);cursor:pointer;">
        Auto-post blinds at the start of each hand
      </label>
    </div>
  </div>

  <div style="width:100%;max-width:420px;">
    <button class="btn btn-gold btn-block" onclick="startGame()">Start Game ♠</button>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════
     GAME SCREEN
═══════════════════════════════════════════════════════ -->
<div id="game-screen">
  <!-- Top Bar -->
  <div class="topbar">
    <div>
      <div class="topbar-title">♠ Poker Tracker</div>
      <div class="topbar-meta" id="topbar-meta">Hand #1</div>
    </div>
    <div class="topbar-right">
      <button class="btn btn-ghost" style="padding:6px 10px;font-size:.8rem;" onclick="openLog()">Log</button>
      <button class="btn btn-ghost" style="padding:6px 10px;font-size:.8rem;" onclick="openStandings()">Standings</button>
    </div>
  </div>

  <!-- Blinds Info Bar -->
  <div class="blinds-info-bar" id="blinds-info-bar">
    <div><span class="blind-btn sb-btn">SB</span> Small Blind: <span id="sb-display">—</span></div>
    <div><span class="blind-btn bb-btn">BB</span> Big Blind: <span id="bb-display">—</span></div>
    <div style="cursor:pointer;color:var(--gold);text-decoration:underline;" onclick="openChangeBlinds()">Change</div>
  </div>

  <!-- Pot Area -->
  <div class="pot-area">
    <div class="pot-label">Total Pot</div>
    <div class="pot-amount" id="pot-display">0</div>
    <div class="pot-actions">
      <button class="btn btn-gold"  style="font-size:.9rem;padding:9px 18px;" onclick="openAwardPot()">🏆 Award Pot</button>
      <button class="btn btn-green" style="font-size:.9rem;padding:9px 16px;" onclick="openChop()">✂️ Chop</button>
      <button class="btn btn-ghost" style="font-size:.9rem;padding:9px 14px;" onclick="openAddToPot()">+ Add to Pot</button>
    </div>
  </div>

  <!-- Current Bet Banner -->
  <div class="bet-banner" id="bet-banner">
    Current bet to call: <strong id="current-bet-display">0</strong>
    &nbsp;·&nbsp;
    <span style="cursor:pointer;text-decoration:underline;" onclick="clearCurrentBet()">Clear</span>
  </div>

  <!-- Players Grid -->
  <div class="players-grid" id="players-grid"></div>

  <!-- Bottom Bar -->
  <div class="bottombar">
    <button class="btn btn-green" style="font-size:.85rem;padding:9px 16px;" onclick="newHand()">🃏 New Hand</button>
    <button class="btn btn-blue"  style="font-size:.85rem;padding:9px 16px;" onclick="openRebuy()">💰 Re-buy</button>
    <button class="btn btn-ghost" style="font-size:.85rem;padding:9px 16px;" onclick="moveDealer()">🔄 Dealer</button>
    <button class="btn btn-ghost" style="font-size:.85rem;padding:9px 16px;" onclick="openChangeBlinds()">🪙 Blinds</button>
    <button class="btn btn-ghost" style="font-size:.85rem;padding:9px 12px;" onclick="backToSetup()">⚙</button>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════
     LOG PANEL
═══════════════════════════════════════════════════════ -->
<div class="overlay-bg" id="log-overlay" onclick="closeLog()"></div>
<div id="log-panel">
  <div class="log-header">
    <h3>Transaction Log</h3>
    <button class="btn btn-ghost" style="padding:5px 10px;font-size:.8rem;" onclick="closeLog()">✕</button>
  </div>
  <div class="log-list" id="log-list"></div>
</div>

<!-- ═══════════════════════════════════════════════════════
     MODAL
═══════════════════════════════════════════════════════ -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-content"></div>
</div>

<script>
// ─────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────
let state = {
  players: [],          // { id, name, chips, status:'active'|'fold'|'allin'|'out', betThisRound, startChips }
  pot: 0,
  currentBet: 0,        // highest bet this round
  handNumber: 1,
  dealerIndex: 0,
  sbIndex: -1,
  bbIndex: -1,
  blinds: { small: 25, big: 50 },
  autoPostBlinds: true,
  log: [],
  buyinAmount: 1000,
  totalChipsInPlay: 0,
};

let setupPlayers = [];  // temp for setup

// ─────────────────────────────────────────────────────────
// SETUP
// ─────────────────────────────────────────────────────────
function setBuyin(v) {
  document.getElementById('buyin-amount').value = v;
}

function setBlinds(sb, bb) {
  document.getElementById('small-blind').value = sb;
  document.getElementById('big-blind').value = bb;
}

function syncBB() {
  const sb = parseInt(document.getElementById('small-blind').value) || 0;
  document.getElementById('big-blind').value = sb * 2;
}

function addPlayer() {
  const inp = document.getElementById('player-name-input');
  const name = inp.value.trim();
  if (!name) { inp.focus(); return; }
  if (setupPlayers.length >= 10) { alert('Maximum 10 players.'); return; }
  if (setupPlayers.find(p => p.toLowerCase() === name.toLowerCase())) {
    alert('Name already added.'); return;
  }
  setupPlayers.push(name);
  inp.value = '';
  inp.focus();
  renderSetupList();
}

function removeSetupPlayer(i) {
  setupPlayers.splice(i, 1);
  renderSetupList();
}

function renderSetupList() {
  const list = document.getElementById('player-list');
  const hint = document.getElementById('player-hint');
  list.innerHTML = '';
  setupPlayers.forEach((name, i) => {
    const el = document.createElement('div');
    el.className = 'player-tag';
    el.innerHTML = `<span>🪙 ${escHtml(name)}</span><button class="remove" onclick="removeSetupPlayer(${i})">✕</button>`;
    list.appendChild(el);
  });
  hint.style.display = setupPlayers.length === 0 ? 'block' : 'none';
}

document.getElementById('player-name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addPlayer();
});

function startGame() {
  if (setupPlayers.length < 2) { alert('Add at least 2 players to start.'); return; }
  const buyin = parseInt(document.getElementById('buyin-amount').value) || 1000;
  state.buyinAmount = buyin;
  state.players = setupPlayers.map((name, i) => ({
    id: i,
    name,
    chips: buyin,
    status: 'active',
    betThisRound: 0,
    startChips: buyin,
  }));
  state.pot = 0;
  state.currentBet = 0;
  state.handNumber = 1;
  state.dealerIndex = 0;
  state.sbIndex = -1;
  state.bbIndex = -1;
  state.blinds = {
    small: parseInt(document.getElementById('small-blind').value) || 25,
    big:   parseInt(document.getElementById('big-blind').value)   || 50,
  };
  state.autoPostBlinds = document.getElementById('auto-post-blinds').checked;
  state.log = [];
  state.totalChipsInPlay = buyin * setupPlayers.length;

  addLog('new-hand', `Game started — ${setupPlayers.length} players, ${fmt(buyin)} chips each`);

  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'flex';

  if (state.autoPostBlinds) postBlinds();
  renderGame();
}

// ─────────────────────────────────────────────────────────
// RENDER GAME
// ─────────────────────────────────────────────────────────
function renderGame() {
  // Topbar
  const activePlayers = state.players.filter(p => p.status !== 'out');
  document.getElementById('topbar-meta').textContent =
    `Hand #${state.handNumber} · ${activePlayers.length} players active`;

  // Blinds info bar
  const sbPlayer = state.players[state.sbIndex];
  const bbPlayer = state.players[state.bbIndex];
  document.getElementById('sb-display').textContent =
    `${fmt(state.blinds.small)}${sbPlayer ? ' · ' + sbPlayer.name : ''}`;
  document.getElementById('bb-display').textContent =
    `${fmt(state.blinds.big)}${bbPlayer ? ' · ' + bbPlayer.name : ''}`;

  // Pot
  document.getElementById('pot-display').textContent = fmt(state.pot);

  // Bet banner
  const banner = document.getElementById('bet-banner');
  if (state.currentBet > 0) {
    banner.classList.add('active');
    document.getElementById('current-bet-display').textContent = fmt(state.currentBet);
  } else {
    banner.classList.remove('active');
  }

  // Players grid
  const grid = document.getElementById('players-grid');
  grid.innerHTML = '';
  state.players.forEach((p, i) => renderPlayerCard(p, i, grid));
}

function renderPlayerCard(p, i, container) {
  const isDealer = i === state.dealerIndex;
  const isSB = i === state.sbIndex;
  const isBB = i === state.bbIndex;
  const card = document.createElement('div');
  card.className = 'player-card' +
    (p.status === 'fold' ? ' folded' : '') +
    (p.status === 'allin' ? ' allin' : '') +
    (p.status === 'out' ? ' eliminated' : '');
  card.id = `card-${p.id}`;

  const chipClass = p.chips === 0 ? ' zero' : p.chips < state.buyinAmount * 0.2 ? ' low' : '';

  let badgeHTML = '';
  if (p.status === 'fold')   badgeHTML = '<span class="player-status-badge badge-fold">Folded</span>';
  if (p.status === 'allin')  badgeHTML = '<span class="player-status-badge badge-allin">ALL IN</span>';
  if (p.status === 'out')    badgeHTML = '<span class="player-status-badge badge-out">Out</span>';

  const betInfo = p.betThisRound > 0
    ? `Bet this round: ${fmt(p.betThisRound)}`
    : '&nbsp;';

  let actionsHTML = '';
  if (p.status !== 'out') {
    const canAct = p.status === 'active';
    const callAmt = Math.max(0, state.currentBet - p.betThisRound);
    const canCall = canAct && callAmt > 0 && callAmt <= p.chips;

    actionsHTML = `
      <div class="player-actions">
        <button class="btn btn-blue" onclick="openBet(${i})" ${!canAct ? 'disabled style="opacity:.4"' : ''}>Bet/Raise</button>
        ${canCall
          ? `<button class="btn btn-green" onclick="playerCall(${i})">Call ${fmt(callAmt)}</button>`
          : `<button class="btn btn-teal"  onclick="playerCheck(${i})" ${!canAct ? 'disabled style="opacity:.4"' : ''}>Check</button>`
        }
        <button class="btn btn-dark" onclick="playerFold(${i})" ${p.status !== 'active' ? 'disabled style="opacity:.4"' : ''}>Fold</button>
        <button class="btn btn-red"  onclick="playerAllin(${i})" ${p.chips === 0 || p.status !== 'active' ? 'disabled style="opacity:.4"' : ''}>All-in</button>
      </div>
    `;
  }

  card.innerHTML = `
    ${badgeHTML}
    <div class="player-name">
      ${isDealer ? '<span class="dealer-btn">D</span>' : ''}${isSB ? '<span class="blind-btn sb-btn">SB</span>' : ''}${isBB ? '<span class="blind-btn bb-btn">BB</span>' : ''} ${escHtml(p.name)}
    </div>
    <div class="player-chips${chipClass}">${fmt(p.chips)}</div>
    <div class="player-bet-row">${betInfo}</div>
    ${actionsHTML}
  `;

  container.appendChild(card);
}

// ─────────────────────────────────────────────────────────
// PLAYER ACTIONS
// ─────────────────────────────────────────────────────────
function playerFold(i) {
  const p = state.players[i];
  p.status = 'fold';
  addLog('fold', `${p.name} folded`);
  renderGame();
  checkAutoWin();
}

function checkAutoWin() {
  const standing = state.players.filter(p => p.status !== 'out' && p.status !== 'fold');
  if (standing.length !== 1 || state.pot === 0) return;
  const winner = standing[0];
  // Short delay so fold animation can finish rendering
  setTimeout(() => {
    winner.chips += state.pot;
    if (winner.status === 'allin') winner.status = 'active';
    addLog('win', `🏆 ${winner.name} wins ${fmt(state.pot)} — everyone else folded!`);
    state.pot = 0;
    state.currentBet = 0;
    renderGame();
    showWinAnimation(winner.name);
    // Auto-start next hand after the animation settles
    setTimeout(() => newHand(), 3400);
  }, 300);
}

function playerCheck(i) {
  const p = state.players[i];
  if (state.currentBet > p.betThisRound) {
    alert(`There's a bet of ${fmt(state.currentBet)} to call. Use "Call" or "Fold".`);
    return;
  }
  addLog('bet', `${p.name} checked`);
  // no chip movement
}

function playerCall(i) {
  const p = state.players[i];
  const callAmt = Math.min(state.currentBet - p.betThisRound, p.chips);
  if (callAmt <= 0) return;
  p.chips -= callAmt;
  p.betThisRound += callAmt;
  state.pot += callAmt;
  if (p.chips === 0) p.status = 'allin';
  addLog('bet', `${p.name} called ${fmt(callAmt)} (pot: ${fmt(state.pot)})`);
  renderGame();
}

function playerAllin(i) {
  const p = state.players[i];
  if (p.chips === 0) return;
  const amt = p.chips;
  p.betThisRound += amt;
  state.pot += amt;
  p.chips = 0;
  p.status = 'allin';
  if (p.betThisRound > state.currentBet) state.currentBet = p.betThisRound;
  addLog('bet', `${p.name} went ALL-IN for ${fmt(amt)} (pot: ${fmt(state.pot)})`);
  renderGame();
}

function openBet(i) {
  const p = state.players[i];
  const callAmt = Math.max(0, state.currentBet - p.betThisRound);
  const chipDefs = [
    {v:1,   cls:'chip-c1',   label:'1'},
    {v:5,   cls:'chip-c5',   label:'5'},
    {v:10,  cls:'chip-c10',  label:'10'},
    {v:25,  cls:'chip-c25',  label:'25'},
    {v:50,  cls:'chip-c50',  label:'50'},
    {v:100, cls:'chip-c100', label:'100'},
    {v:500, cls:'chip-c500', label:'500'},
    {v:1000,cls:'chip-c1k',  label:'1K'},
    {v:5000,cls:'chip-c5k',  label:'5K'},
  ].filter(c => c.v <= p.chips);

  const chipHTML = chipDefs.map(c =>
    `<div class="chip-token ${c.cls}" onclick="addToBet(${c.v})">+${c.label}</div>`
  ).join('');

  showModal(`
    <h3>Bet / Raise — ${escHtml(p.name)}</h3>
    <div style="display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-bottom:4px;">
      <span>Stack: <strong style="color:var(--gold2)">${fmt(p.chips)}</strong></span>
      ${callAmt > 0 ? `<span>To call: <strong style="color:#4fa8e0">${fmt(callAmt)}</strong></span>` : ''}
    </div>
    <div class="chip-strip">${chipHTML}</div>
    <div class="bet-total-display" id="bet-total-display">0</div>
    <div class="bet-total-label">chips to bet &nbsp;·&nbsp; <span style="cursor:pointer;color:var(--gold);text-decoration:underline;" onclick="clearBetField()">Clear</span></div>
    <div class="input-row" style="margin-top:4px;">
      <input type="number" id="bet-field" value="0" min="0" max="${p.chips}"
        style="font-size:1rem;padding:10px;text-align:center;"
        oninput="document.getElementById('bet-total-display').textContent=fmt(parseInt(this.value)||0)" />
    </div>
    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
      ${callAmt > 0 && callAmt <= p.chips ? `<button class="btn btn-green" style="flex:1;font-size:.85rem;" onclick="setBetExact(${callAmt})">Call ${fmt(callAmt)}</button>` : ''}
      <button class="btn btn-ghost" style="flex:1;font-size:.85rem;" onclick="setBetExact(${Math.floor(state.pot / 2)})">½ Pot (${fmt(Math.floor(state.pot/2))})</button>
      <button class="btn btn-ghost" style="flex:1;font-size:.85rem;" onclick="setBetExact(${state.pot})">Pot (${fmt(state.pot)})</button>
      <button class="btn btn-red"   style="flex:1;font-size:.85rem;" onclick="setBetExact(${p.chips})">All-in</button>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold"  onclick="confirmBet(${i})">Place Bet</button>
    </div>
  `);
}

function addToBet(v) {
  const f = document.getElementById('bet-field');
  const p = state.players.find(x => x.status === 'active'); // just for cap; confirmBet validates
  if (!f) return;
  const cur = parseInt(f.value) || 0;
  f.value = cur + v;
  document.getElementById('bet-total-display').textContent = fmt(cur + v);
}

function setBetExact(v) {
  const f = document.getElementById('bet-field');
  if (!f) return;
  f.value = v;
  document.getElementById('bet-total-display').textContent = fmt(v);
}

function clearBetField() {
  const f = document.getElementById('bet-field');
  if (!f) return;
  f.value = 0;
  document.getElementById('bet-total-display').textContent = '0';
}

function confirmBet(i) {
  const p = state.players[i];
  const amt = parseInt(document.getElementById('bet-field').value) || 0;
  if (amt <= 0) { alert('Enter a valid bet amount.'); return; }
  if (amt > p.chips) { alert(`${p.name} only has ${fmt(p.chips)} chips.`); return; }

  const totalBet = p.betThisRound + amt;
  p.chips -= amt;
  p.betThisRound = totalBet;
  state.pot += amt;
  if (totalBet > state.currentBet) state.currentBet = totalBet;
  if (p.chips === 0) p.status = 'allin';

  addLog('bet', `${p.name} bet ${fmt(amt)} (total bet: ${fmt(totalBet)}, pot: ${fmt(state.pot)})`);
  closeModal();
  renderGame();
}

// ─────────────────────────────────────────────────────────
// POT MANAGEMENT
// ─────────────────────────────────────────────────────────
function openAddToPot() {
  showModal(`
    <h3>Add Chips to Pot</h3>
    <p class="modal-note">Manually add any amount to the pot (e.g. blinds, antes).</p>
    <div class="chip-quick mt8">
      ${[5,10,25,50,100,200].map(v =>
        `<button onclick="addToPotAmount(${v})">${fmt(v)}</button>`
      ).join('')}
    </div>
    <div class="input-row mt8">
      <input type="number" id="pot-add-field" placeholder="Amount" min="1" style="font-size:1.1rem;padding:10px;" />
      <select id="pot-add-player" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px;font-size:.9rem;">
        <option value="">— Any player —</option>
        ${state.players.filter(p=>p.status!=='out').map(p =>
          `<option value="${p.id}">${escHtml(p.name)} (${fmt(p.chips)})</option>`
        ).join('')}
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold"  onclick="confirmAddToPot()">Add</button>
    </div>
  `);
}

function addToPotAmount(v) {
  const f = document.getElementById('pot-add-field');
  if (f) { f.value = (parseInt(f.value)||0) + v; }
}

function confirmAddToPot() {
  const amt = parseInt(document.getElementById('pot-add-field').value) || 0;
  const pid = document.getElementById('pot-add-player').value;
  if (amt <= 0) { alert('Enter an amount.'); return; }

  if (pid !== '') {
    const p = state.players.find(x => x.id === parseInt(pid));
    if (p) {
      if (amt > p.chips) { alert(`${p.name} only has ${fmt(p.chips)}.`); return; }
      p.chips -= amt;
      p.betThisRound += amt;
      if (p.betThisRound > state.currentBet) state.currentBet = p.betThisRound;
      if (p.chips === 0) p.status = 'allin';
      addLog('bet', `${p.name} put ${fmt(amt)} in pot`);
    }
  } else {
    addLog('bet', `${fmt(amt)} added to pot`);
  }
  state.pot += amt;
  closeModal();
  renderGame();
}

// ─────────────────────────────────────────────────────────
// CHOP
// ─────────────────────────────────────────────────────────
function openChop() {
  if (state.pot === 0) { alert('The pot is empty.'); return; }
  const candidates = state.players.filter(p => p.status !== 'out' && p.status !== 'fold');
  if (candidates.length === 0) { alert('No active players to chop with.'); return; }
  renderChopModal(candidates, 'even');
}

function renderChopModal(candidates, mode) {
  const pot = state.pot;

  const evenRows = candidates.map(p => `
    <div class="player-select-item" id="chop-sel-${p.id}" onclick="toggleChopPlayer(${p.id})" style="user-select:none;">
      <input type="checkbox" id="chop-chk-${p.id}" checked onclick="event.stopPropagation();toggleChopPlayer(${p.id})" />
      <div class="player-select-info">
        <div class="player-select-name">${escHtml(p.name)}</div>
        <div class="player-select-chips">${fmt(p.chips)} chips</div>
      </div>
      <span class="split-pct" id="chop-share-${p.id}"></span>
    </div>
  `).join('');

  const customRows = candidates.map(p => `

  `).join('');

  showModal(`
    <h3>✂️ Chop Pot — ${fmt(pot)}</h3>

    <div class="mode-toggle">
      <button id="btn-even"   onclick="switchChopMode('even',   [${candidates.map(p=>p.id)}])"
        class="${mode==='even'?'active':''}">Even Split</button>
      <button id="btn-custom" onclick="switchChopMode('custom', [${candidates.map(p=>p.id)}])"
        class="${mode==='custom'?'active':''}">Custom Amounts</button>
    </div>

    <div id="chop-even-panel"   style="display:${mode==='even'  ?'block':'none'};">
      <p class="modal-note" style="margin-bottom:10px;">Select who is chopping. Remainder goes to the first selected player.</p>
      <div class="player-select-list" id="chop-even-list">${evenRows}</div>
      <div class="chop-total-row" id="chop-even-summary"></div>
    </div>

    <div id="chop-custom-panel" style="display:${mode==='custom'?'block':'none'};">
      <p class="modal-note" style="margin-bottom:10px;">Enter each player's share. Total must equal the pot.</p>
      ${customRows}
      <div class="chop-total-row" id="chop-custom-total">
        <span>Total allocated</span><span id="chop-total-val" class="bad">0 / ${fmt(pot)}</span>
      </div>
      <button class="btn btn-ghost" style="width:100%;margin-top:8px;font-size:.82rem;padding:8px;"
        onclick="splitEvenlyIntoCustom([${candidates.map(p=>p.id)}], ${pot})">Auto-fill even split</button>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-green" onclick="confirmChop([${candidates.map(p=>p.id)}], ${pot})">✂️ Chop It</button>
    </div>
  `);

  if (mode === 'even') {
    // All players pre-selected — show initial split
    updateChopEvenSplit(candidates.map(p => p.id), pot);
  }
}

function switchChopMode(mode, candidateIds) {
  const evenPanel   = document.getElementById('chop-even-panel');
  const customPanel = document.getElementById('chop-custom-panel');
  const btnEven     = document.getElementById('btn-even');
  const btnCustom   = document.getElementById('btn-custom');
  if (mode === 'even') {
    evenPanel.style.display   = 'block';
    customPanel.style.display = 'none';
    btnEven.classList.add('active');
    btnCustom.classList.remove('active');
    updateChopEvenSplit(candidateIds, state.pot);
  } else {
    evenPanel.style.display   = 'none';
    customPanel.style.display = 'block';
    btnCustom.classList.add('active');
    btnEven.classList.remove('active');
    updateChopTotal(state.pot);
  }
}

function toggleChopPlayer(id) {
  const chk  = document.getElementById(`chop-chk-${id}`);
  const item = document.getElementById(`chop-sel-${id}`);
  chk.checked = !chk.checked;
  item.classList.toggle('selected', chk.checked);
  // gather all candidate ids from checked items
  const allItems = [...document.querySelectorAll('[id^="chop-sel-"]')];
  const allIds   = allItems.map(el => parseInt(el.id.replace('chop-sel-', '')));
  updateChopEvenSplit(allIds, state.pot);
}

function updateChopEvenSplit(allIds, pot) {
  const selectedIds = allIds.filter(id => {
    const chk = document.getElementById(`chop-chk-${id}`);
    return chk && chk.checked;
  });
  const count = selectedIds.length;

  // Clear all share labels
  allIds.forEach(id => {
    const el = document.getElementById(`chop-share-${id}`);
    if (el) el.textContent = '';
  });

  const summary = document.getElementById('chop-even-summary');
  if (count === 0) {
    if (summary) summary.innerHTML = '<span>Select at least one player.</span>';
    return;
  }

  const share     = Math.floor(pot / count);
  const remainder = pot - share * count;

  selectedIds.forEach((id, idx) => {
    const el = document.getElementById(`chop-share-${id}`);
    if (!el) return;
    const gets = share + (idx === 0 ? remainder : 0);
    el.textContent = fmt(gets);
    el.style.color = 'var(--gold2)';
    el.style.fontWeight = '700';
  });

  if (summary) {
    const remainderNote = remainder > 0
      ? ` <span style="color:var(--muted);font-size:.78rem;">(+${remainder} remainder to first)</span>`
      : '';
    summary.innerHTML = `
      <span>${count} player${count>1?'s':''} chopping</span>
      <span class="ok">${fmt(share)} each${remainderNote}</span>
    `;
  }
}

function updateChopTotal(pot) {
  const inputs = [...document.querySelectorAll('[id^="chop-amt-"]')];
  const total  = inputs.reduce((s, inp) => s + (parseInt(inp.value) || 0), 0);
  const el     = document.getElementById('chop-total-val');
  if (!el) return;
  const ok = total === pot;
  el.textContent = `${fmt(total)} / ${fmt(pot)}`;
  el.className   = ok ? 'ok' : 'bad';
}

function splitEvenlyIntoCustom(candidateIds, pot) {
  const count     = candidateIds.length;
  const share     = Math.floor(pot / count);
  const remainder = pot - share * count;
  candidateIds.forEach((id, idx) => {
    const inp = document.getElementById(`chop-amt-${id}`);
    if (inp) inp.value = share + (idx === 0 ? remainder : 0);
  });
  updateChopTotal(pot);
}

function confirmChop(candidateIds, pot) {
  const evenPanel = document.getElementById('chop-even-panel');
  const isEven    = evenPanel && evenPanel.style.display !== 'none';

  let chopNames = '';

  if (isEven) {
    const selectedIds = candidateIds.filter(id => {
      const chk = document.getElementById(`chop-chk-${id}`);
      return chk && chk.checked;
    });
    if (selectedIds.length === 0) { alert('Select at least one player.'); return; }

    const share     = Math.floor(pot / selectedIds.length);
    const remainder = pot - share * selectedIds.length;

    selectedIds.forEach((id, idx) => {
      const p = state.players.find(x => x.id === id);
      if (!p) return;
      const gets = share + (idx === 0 ? remainder : 0);
      p.chips += gets;
      if (p.status === 'allin' || p.status === 'fold') p.status = 'active';
      addLog('win', `✂️ ${p.name} chopped ${fmt(gets)} — now has ${fmt(p.chips)}`);
    });

    chopNames = selectedIds.map(id => state.players.find(x=>x.id===id)?.name).filter(Boolean).join(' & ');
    addLog('win', `✂️ Pot of ${fmt(pot)} chopped between: ${chopNames}`);

  } else {
    const inputs = [...document.querySelectorAll('[id^="chop-amt-"]')];
    const total  = inputs.reduce((s, inp) => s + (parseInt(inp.value) || 0), 0);
    if (total !== pot) {
      alert(`Total allocated (${fmt(total)}) must equal the pot (${fmt(pot)}).`);
      return;
    }

    let anyAwarded = false;
    const chopIds = [];
    candidateIds.forEach(id => {
      const inp = document.getElementById(`chop-amt-${id}`);
      const amt = parseInt(inp?.value) || 0;
      if (amt <= 0) return;
      const p = state.players.find(x => x.id === id);
      if (!p) return;
      p.chips += amt;
      if (p.status === 'allin' || p.status === 'fold') p.status = 'active';
      addLog('win', `✂️ ${p.name} chopped ${fmt(amt)} — now has ${fmt(p.chips)}`);
      chopIds.push(p.name);
      anyAwarded = true;
    });
    if (!anyAwarded) { alert('Enter amounts greater than 0.'); return; }
    chopNames = chopIds.join(' & ');
  }

  state.pot        = 0;
  state.currentBet = 0;
  closeModal();
  renderGame();
  showWinAnimation(chopNames);
}

function openAwardPot() {
  if (state.pot === 0) { alert('The pot is empty.'); return; }
  const eligible = state.players.filter(p => p.status !== 'out' && p.status !== 'fold');
  if (eligible.length === 0) {

    const all = state.players.filter(p => p.status !== 'out');

function toggleWinner(id) {

  if (count > 1) {
    selected.forEach(el => {

function confirmAwardPot() {
  const selected = [...document.querySelectorAll('.player-select-item.selected')];
  if (selected.length === 0) { alert('Select at least one winner.'); return; }

  const winnerIds = selected.map(el => parseInt(el.id.replace('sel-','')));

  // All players who put chips in this round
  const contributors = state.players.filter(p => p.betThisRound > 0);

  // Cap = the lowest bet among winners — a player can only win as much as they put in from each opponent
  const winnerCap = Math.min(
    ...winnerIds.map(id => state.players.find(x => x.id === id)?.betThisRound ?? Infinity)
  );

  // Main pot = sum of min(winnerCap, each contributor's bet)
  const mainPot = contributors.reduce((sum, p) => sum + Math.min(winnerCap, p.betThisRound), 0);

  const share     = Math.floor(mainPot / winnerIds.length);
  const remainder = mainPot - share * winnerIds.length;

  winnerIds.forEach((id, idx) => {
    const p = state.players.find(x => x.id === id);
    if (!p) return;
    const gets = share + (idx === 0 ? remainder : 0);
    p.chips += gets;
    if (p.status === 'allin' || p.status === 'fold') p.status = 'active';
    addLog('win', `🏆 ${p.name} won ${fmt(gets)}${winnerIds.length > 1 ? ' (split)' : ''} — now has ${fmt(p.chips)}`);
  });

  state.pot -= mainPot;

  // Return unmatched chips: any all-in loser who bet more than the winner's cap gets the excess back.
  // Only when exactly one player has excess (otherwise it's a contested side pot — leave it in the pot).
  const coveredAllIns = contributors.filter(p =>
    !winnerIds.includes(p.id) &&
    p.status === 'allin' &&
    p.betThisRound > winnerCap
  );
  if (coveredAllIns.length === 1) {
    const p = coveredAllIns[0];
    const excess = p.betThisRound - winnerCap;
    p.chips += excess;
    p.status = 'active';
    state.pot -= excess;
    addLog('bet', `${p.name} got back ${fmt(excess)} unmatched chips`);
  }

  state.currentBet = 0;
  const names = winnerIds.map(id => state.players.find(x=>x.id===id)?.name).filter(Boolean).join(' & ');
  closeModal();
  renderGame();
  winnerIds.forEach(id => {
    const card = document.getElementById(`card-${id}`);
    if (card) { card.classList.add('winner'); setTimeout(()=>card.classList.remove('winner'), 2000); }
  });
  showWinAnimation(names);
}

function clearCurrentBet() {
  state.currentBet = 0;
  state.players.forEach(p => { p.betThisRound = 0; });
  renderGame();
}

// HAND MANAGEMENT
// ─────────────────────────────────────────────────────────
function newHand() {
  if (state.pot > 0) {
    if (!confirm(`There are ${fmt(state.pot)} chips still in the pot. Award them before starting a new hand, or click OK to carry over.`)) return;
  }
  state.handNumber++;
  state.currentBet = 0;
  state.sbIndex = -1;
  state.bbIndex = -1;
  const newlyBusted = [];
  state.players.forEach(p => {
    p.betThisRound = 0;
    if (p.status !== 'out') {
      if (p.chips === 0) { p.status = 'out'; newlyBusted.push(p.name); }
      else p.status = 'active';
    }
  });
  // Advance dealer to next active player
  state.dealerIndex = nextActiveIndex(state.dealerIndex);
  addLog('new-hand', `═══ Hand #${state.handNumber} — Dealer: ${state.players[state.dealerIndex].name} ═══`);
  if (state.autoPostBlinds) postBlinds();
  renderGame();
  newlyBusted.forEach((name, i) => setTimeout(() => showBustAnimation(name), i * 1600));
}

// ─────────────────────────────────────────────────────────
// BLIND LOGIC
// ─────────────────────────────────────────────────────────
function nextActiveIndex(fromIndex) {
  const n = state.players.length;
  let idx = (fromIndex + 1) % n;
  for (let i = 0; i < n; i++) {
    if (state.players[idx].status !== 'out') return idx;
    idx = (idx + 1) % n;
  }
  return fromIndex;
}

function computeBlindPositions() {
  const active = state.players.filter(p => p.status !== 'out');
  if (active.length < 2) return;
  if (active.length === 2) {
    // Heads-up: dealer posts SB, other player posts BB
    state.sbIndex = state.dealerIndex;
    state.bbIndex = nextActiveIndex(state.dealerIndex);
  } else {
    state.sbIndex = nextActiveIndex(state.dealerIndex);
    state.bbIndex = nextActiveIndex(state.sbIndex);
  }
}

function postBlinds() {
  computeBlindPositions();
  if (state.sbIndex < 0 || state.bbIndex < 0) return;

  const sb = state.players[state.sbIndex];
  const bb = state.players[state.bbIndex];
  const sbAmt = Math.min(state.blinds.small, sb.chips);
  const bbAmt = Math.min(state.blinds.big,   bb.chips);

  sb.chips -= sbAmt;
  sb.betThisRound += sbAmt;
  state.pot += sbAmt;
  if (sb.chips === 0) sb.status = 'allin';

  bb.chips -= bbAmt;
  bb.betThisRound += bbAmt;
  state.pot += bbAmt;
  if (bb.chips === 0) bb.status = 'allin';

  // Current bet is the BB amount (SB still owes the difference)
  state.currentBet = bbAmt;

  addLog('bet', `Blinds posted — ${sb.name} SB: ${fmt(sbAmt)}, ${bb.name} BB: ${fmt(bbAmt)} (pot: ${fmt(state.pot)})`);
}

function setChangeBlinds(sb, bb) {
  const sf = document.getElementById('change-sb');
  const bf = document.getElementById('change-bb');
  if (sf) sf.value = sb;
  if (bf) bf.value = bb;
}

function confirmChangeBlinds(postNow) {
  const sb = parseInt(document.getElementById('change-sb').value) || state.blinds.small;
  const bb = parseInt(document.getElementById('change-bb').value) || state.blinds.big;
  if (sb >= bb) { alert('Big blind must be greater than the small blind.'); return; }
  state.blinds.small = sb;
  state.blinds.big   = bb;
  state.autoPostBlinds = document.getElementById('change-auto').checked;
  addLog('new-hand', `Blinds changed to ${fmt(sb)}/${fmt(bb)}`);
  closeModal();
  if (postNow) {
    // Reset bets first so blinds post cleanly
    state.currentBet = 0;
    state.players.forEach(p => { p.betThisRound = 0; });
    postBlinds();
  }
  renderGame();
}

function moveDealer() {
  const active = state.players.filter(p => p.status !== 'out');
  if (active.length < 2) return;
  // find next active player after current dealer
  let next = (state.dealerIndex + 1) % state.players.length;
  let tries = 0;
  while (state.players[next].status === 'out' && tries < state.players.length) {
    next = (next + 1) % state.players.length;
    tries++;
  }
  state.dealerIndex = next;
  addLog('bet', `Dealer button moved to ${state.players[next].name}`);
  renderGame();
}

function openStandings() {
  const sorted = [...state.players].sort((a,b) => b.chips - a.chips);
  const medals = ['🥇','🥈','🥉'];

  const rowsHTML = sorted.map((p, i) => {
    const delta = p.chips - state.buyinAmount;
    const deltaStr = delta > 0
      ? `<span class="standings-delta delta-pos">+${fmt(delta)}</span>`
      : delta < 0
      ? `<span class="standings-delta delta-neg">${fmt(delta)}</span>`
      : '';
    return `
      <div class="standings-row">
        <span class="standings-rank">${medals[i] || (i+1)+'.'}</span>
        <span class="standings-name">${escHtml(p.name)}${p.status==='out'?'<span style="color:#666;font-size:.75rem;"> (out)</span>':''}</span>
        <span class="standings-chips">${fmt(p.chips)}</span>
        ${deltaStr}
      </div>
    `;
  }).join('');

  const totalInPlay = state.players.reduce((s, p) => s + p.chips, 0) + state.pot;

  showModal(`
    <h3>📊 Standings — Hand #${state.handNumber}</h3>
    ${rowsHTML}
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:.8rem;color:var(--muted);">

    <div class="modal-actions">
      <button class="btn btn-ghost btn-block" onclick="closeModal()">Close</button>
    </div>
  `);
}

// ─────────────────────────────────────────────────────────
function addLog(type, msg) {
  const now = new Date();
  const time = now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  state.log.unshift({ type, msg, time });
}

function openLog() {
  const list = document.getElementById('log-list');
  list.innerHTML = state.log.length === 0
    ? '<p style="color:var(--muted);padding:10px;font-size:.85rem;">No activity yet.</p>'
    : state.log.map(e => `
        <div class="log-entry ${e.type}">
          <div class="log-time">${e.time}</div>
          ${escHtml(e.msg)}
        </div>
      `).join('');
  document.getElementById('log-panel').classList.add('open');
  document.getElementById('log-overlay').classList.add('open');
}

function closeLog() {
  document.getElementById('log-panel').classList.remove('open');
  document.getElementById('log-overlay').classList.remove('open');
}

// ─────────────────────────────────────────────────────────
// MODAL
// ─────────────────────────────────────────────────────────
function showModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
}

// allow pressing Escape to close modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('modal-overlay').classList.remove('open');
    closeLog();
  }
});

// ─────────────────────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────────────────────
function backToSetup() {
  if (!confirm('Return to setup? Current game progress will be lost.')) return;
  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('setup-screen').style.display = 'flex';
}

// ─────────────────────────────────────────────────────────
// ANIMATIONS
// ─────────────────────────────────────────────────────────
const WIN_LINES  = [
  'GETTING PAID 💅', 'EZ MONEY 🤑', 'SKILL DIFF 🧠', 'TOO EASY 😏',
  'GG NO RE 😂', 'ABSOLUTE CINEMA 🎬', 'SIMPLY THE BEST 🐐',
  'ROBBERY IN PROGRESS 🚨', 'BUILT DIFFERENT 💪', 'NOT EVEN CLOSE 😴',
];
const BUST_LINES = [
  'REKT 💀', 'SKILL ISSUE 🤡', 'L + RATIO 📉', 'CRIES IN BROKE 😭',
  'DELETED FROM THE GAME 🗑️', 'PACK IT UP 🧳', 'CLOWNED ON 🎪',
  'TOUCHED GRASS INVOLUNTARILY 🌿', 'FINANCIALLY DECEASED 🪦', 'GIT GUD 🤣',
];
function randLine(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function showWinAnimation(names) {
  const overlay = document.createElement('div');
  overlay.className = 'anim-overlay';

  const coinEmojis = ['🪙','💰','💵','🤑','💎','🏆','💸'];
  for (let i = 0; i < 32; i++) {
    const c = document.createElement('span');
    c.className = 'anim-coin';
    c.textContent = coinEmojis[Math.floor(Math.random() * coinEmojis.length)];
    c.style.left              = `${Math.random() * 105}%`;
    c.style.fontSize          = `${1 + Math.random() * 1.4}rem`;
    c.style.animationDuration = `${0.9 + Math.random() * 1.4}s`;
    c.style.animationDelay    = `${Math.random() * 1}s`;
    overlay.appendChild(c);
  }

  const banner = document.createElement('div');
  banner.className = 'anim-win-banner';
  banner.innerHTML = `
    <div style="font-size:2.8rem;line-height:1;">🏆😏</div>
    <div style="font-size:1.5rem;font-weight:900;margin-top:8px;max-width:280px;">${escHtml(names)}</div>
    <div style="font-size:.95rem;font-weight:700;letter-spacing:.1em;margin-top:8px;opacity:.9;background:rgba(0,0,0,.18);border-radius:8px;padding:4px 10px;">${randLine(WIN_LINES)}</div>
  `;
  overlay.appendChild(banner);

  document.body.appendChild(overlay);
  setTimeout(() => overlay.remove(), 3400);
}

function showBustAnimation(name) {
  const overlay = document.createElement('div');
  overlay.className = 'anim-overlay';

  const bustEmojis = ['💸','😭','😱','🤡','🗑️','📉','🪦','💔','😢','🌿'];
  for (let i = 0; i < 18; i++) {
    const c = document.createElement('span');
    c.className = 'anim-bust-chip';
    c.textContent = bustEmojis[Math.floor(Math.random() * bustEmojis.length)];
    const angle = (i / 18) * 360 + Math.random() * 20;
    const dist  = 80 + Math.random() * 180;
    c.style.setProperty('--tx', `${Math.cos(angle * Math.PI / 180) * dist}px`);
    c.style.setProperty('--ty', `${Math.sin(angle * Math.PI / 180) * dist}px`);
    c.style.fontSize          = `${1 + Math.random() * 1.2}rem`;
    c.style.animationDuration = `${0.8 + Math.random() * 0.6}s`;
    c.style.animationDelay    = `${Math.random() * 0.3}s`;
    overlay.appendChild(c);
  }

  const banner = document.createElement('div');
  banner.className = 'anim-bust-banner';
  banner.innerHTML = `
    <div style="font-size:2.8rem;line-height:1;">💀🤡</div>
    <div style="font-size:1.4rem;font-weight:900;margin-top:8px;max-width:260px;">${escHtml(name)}</div>
    <div style="font-size:.92rem;font-weight:700;letter-spacing:.1em;margin-top:8px;opacity:.92;background:rgba(0,0,0,.22);border-radius:8px;padding:4px 10px;">${randLine(BUST_LINES)}</div>
  `;
  overlay.appendChild(banner);

  // Shake the whole page to really rub it in
  document.body.classList.add('screen-shake');
  setTimeout(() => document.body.classList.remove('screen-shake'), 650);

  document.body.appendChild(overlay);
  setTimeout(() => overlay.remove(), 3400);
}

// ─────────────────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────────────────
function fmt(n) {
  return Number(n).toLocaleString();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
